/* A single white gallery ground, painted explicitly so the page holds on any host. */
:root {
  color-scheme: light;

  --paper:    #FFFFFF;
  --ink:      #111110;
  --ink-soft: #8A8781;
  --rule:     #E8E6E2;
  --field:    #F4F3F1;

  --pad: clamp(1.1rem, 2.6vw, 2.25rem);

  --display: "Rugby", "Haettenschweiler", "Arial Narrow", sans-serif;
  --body: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

html { background: var(--paper); }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 0.92rem;
  line-height: 1.45;
  margin: 0;
  -webkit-font-smoothing: antialiased;
}

img { display: block; max-width: 100%; }

:focus-visible {
  outline: 1.5px solid var(--ink);
  outline-offset: 3px;
}

/* ---------- top bar (shared with About) ---------- */

.bar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 1rem;
  padding: 1.15rem var(--pad);
  background: var(--paper);
}

.bar__mark {
  font-family: var(--display);
  font-size: clamp(1rem, 2.6vw, 1.35rem);
  line-height: 1;
  margin: 0;
  padding-top: 0.1em;
  white-space: nowrap;
}

.bar__mark a { color: inherit; text-decoration: none; }

.bar__nav {
  display: flex;
  justify-content: center;
  gap: 1.5rem;
}

.bar__nav a {
  color: inherit;
  text-decoration: none;
  padding-bottom: 0.15em;
  border-bottom: 1px solid transparent;
}

.bar__nav a:hover { border-bottom-color: var(--rule); }
.bar__nav a[aria-current="page"] { border-bottom-color: var(--ink); }

.bar__end {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 0.6rem;
}

.counter {
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

.navbtn {
  width: 2rem;
  height: 2rem;
  display: grid;
  place-items: center;
  padding: 0;
  font: inherit;
  line-height: 1;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 0;
  cursor: pointer;
}

.navbtn:hover:not(:disabled) { border-color: var(--ink); }
.navbtn:disabled { color: var(--rule); cursor: default; }

@media (max-width: 34rem) {
  .bar { gap: 0.6rem; }
  .bar__nav { gap: 1rem; }
  .navbtn { display: none; }
}

/* ---------- the reel: one photograph per screen ---------- */

.cover {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}

.reel {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.reel::-webkit-scrollbar { display: none; }

.slide {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  margin: 0;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  padding: 0 var(--pad) clamp(1.1rem, 2.6vw, 2.25rem);
}

.slide img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  min-height: 0;
  object-fit: contain;
  cursor: pointer;
  user-select: none;
  -webkit-user-drag: none;
}

.slide__cap {
  flex: 0 0 auto;
  color: var(--ink-soft);
}

/* placeholder slides, shown until photos land in photos/ */

.slide .slot {
  width: min(100%, 40rem);
  height: 70%;
  background: var(--field);
  display: grid;
  place-items: center;
  color: var(--ink-soft);
}

@media (prefers-reduced-motion: reduce) {
  .reel { scroll-behavior: auto; }
}
</style>

<script>
(function () {
  var reel = document.getElementById("reel");
  var prev = document.getElementById("prev");
  var next = document.getElementById("next");
  var counter = document.getElementById("counter");
  if (!reel) return;

  var slides = reel.querySelectorAll(".slide");
  var total = slides.length;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var idx = 0;

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function width() { return reel.clientWidth || 1; }

  function current() {
    return Math.max(0, Math.min(total - 1, Math.round(reel.scrollLeft / width())));
  }

  function warm(i) {
    // make sure the neighbours are decoded before they slide in
    for (var k = i - 1; k <= i + 2; k++) {
      if (k < 0 || k >= total) continue;
      var img = slides[k].querySelector("img");
      if (img && img.loading === "lazy") img.loading = "eager";
    }
  }

  function render(i) {
    idx = i;
    if (counter) counter.textContent = pad(i + 1) + "/" + pad(total);
    if (prev) prev.disabled = i <= 0;
    if (next) next.disabled = i >= total - 1;
    warm(i);
  }

  // Only reconcile with the real position once scrolling has settled - never
  // mid-animation, or a stray scroll event from the previous move would
  // clobber the target and cancel the new one. A timed fallback covers hosts
  // where scroll events don't fire at all.
  var target = 0, settleTimer = null, fallbackTimer = null;

  function settle() {
    clearTimeout(settleTimer); clearTimeout(fallbackTimer);
    idx = current();
    target = idx;
    render(idx);
  }

  function goTo(i, instant) {
    i = Math.max(0, Math.min(total - 1, i));
    target = i;
    render(i);                                   // feedback now, not after the animation
    reel.scrollTo({ left: i * width(), behavior: (instant || reduce) ? "auto" : "smooth" });
    clearTimeout(fallbackTimer);
    fallbackTimer = setTimeout(function () {
      // a smooth scroll can be cancelled by a snap settling under it - if we
      // never arrived, jump there rather than quietly reverting the counter
      if (current() !== target) reel.scrollTo({ left: target * width(), behavior: "auto" });
      settle();
    }, 900);
  }

  // step from where we're headed, so quick repeated presses don't get swallowed
  function go(dir) { goTo(target + dir); }

  if (prev) prev.addEventListener("click", function () { go(-1); });
  if (next) next.addEventListener("click", function () { go(1); });

  reel.addEventListener("scroll", function () {
    clearTimeout(settleTimer);
    settleTimer = setTimeout(settle, 140);
  }, { passive: true });

  // keep the same photograph in view when the window changes size
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { goTo(target, true); }, 80);
  });

  // a mouse wheel has no sideways axis: a firm vertical tick moves one photo.
  // Trackpad sideways swipes are left to the browser.
  var acc = 0, wheelLock = false;
  reel.addEventListener("wheel", function (e) {
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    e.preventDefault();
    if (wheelLock) return;
    acc += e.deltaY;
    if (Math.abs(acc) >= 40) {
      go(acc > 0 ? 1 : -1);
      acc = 0;
      wheelLock = true;
      setTimeout(function () { wheelLock = false; }, 500);
    }
  }, { passive: false });

  // click the right half of a photograph for the next, the left half for the previous
  reel.addEventListener("click", function (e) {
    if (!e.target.closest(".slide")) return;
    if (e.target.closest("a, button")) return;
    go(e.clientX > window.innerWidth / 2 ? 1 : -1);
  });

  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowRight") { go(1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { go(-1); e.preventDefault(); }
    else if (e.key === "Home") { goTo(0); e.preventDefault(); }
    else if (e.key === "End") { goTo(total - 1); e.preventDefault(); }
  });

  settle();
})();
</script>
