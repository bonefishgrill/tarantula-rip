/* A single white gallery ground, painted explicitly so the page holds on any host. */
:root {
  color-scheme: light;

  --paper:    #FFFFFF;
  --ink:      #111110;
  --ink-soft: #8A8781;
  --rule:     #E8E6E2;
  --field:    #F4F3F1;

  --pad: clamp(1.1rem, 2.6vw, 2.25rem);
  --gap-x: clamp(1rem, 2.2vw, 2rem);
  --gap-y: clamp(2.25rem, 4.5vw, 4rem);

  --display: "Rugby", "Haettenschweiler", "Arial Narrow", sans-serif;
  --body: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

html { background: var(--paper); }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 0.92rem;
  line-height: 1.45;
  margin: 0;
  -webkit-font-smoothing: antialiased;
}

img { display: block; max-width: 100%; }

:focus-visible {
  outline: 1.5px solid var(--ink);
  outline-offset: 3px;
}

/* ---------- top bar ---------- */

.bar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 1rem;
  padding: 1.15rem var(--pad);
  background: var(--paper);
}

.bar__mark {
  font-family: var(--display);
  font-size: clamp(1rem, 2.6vw, 1.35rem);
  line-height: 1;
  margin: 0;
  padding-top: 0.1em;
  white-space: nowrap;
}

.bar__mark a { color: inherit; text-decoration: none; }

.bar__nav {
  display: flex;
  justify-content: center;
  gap: 1.5rem;
}

.bar__nav a {
  color: inherit;
  text-decoration: none;
  padding-bottom: 0.15em;
  border-bottom: 1px solid transparent;
}

.bar__nav a:hover { border-bottom-color: var(--rule); }
.bar__nav a[aria-current="page"] { border-bottom-color: var(--ink); }

@media (max-width: 34rem) {
  .bar { grid-template-columns: auto 1fr; }
  .bar__nav { justify-content: flex-end; }
}

/* ---------- opening plate ---------- */

.hero { padding: 0 var(--pad); }

.hero__frame {
  width: 100%;
  height: min(60vh, 46vw);
  min-height: 15rem;
  background: var(--field);
  overflow: hidden;
}

.hero__frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 35%;
}

/* a portrait hero can't survive a wide cover crop - show it whole, centred */
.hero--portrait {
  width: fit-content;
  max-width: 100%;
  margin-inline: auto;
}

.hero--portrait .hero__frame {
  width: auto;
  height: min(84vh, 115vw);
  background: var(--paper);
}

.hero--portrait .hero__frame img {
  width: auto;
  height: 100%;
  object-fit: unset;
}

.hero__caption {
  display: flex;
  justify-content: space-between;
  gap: 1.5rem;
  margin: 0.55rem 0 0;
  color: var(--ink-soft);
}

.hero__caption span:last-child { font-variant-numeric: tabular-nums; }

/* ---------- the grid ---------- */

.plates {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  align-items: start;
  gap: var(--gap-y) var(--gap-x);
  padding: 0 var(--pad);
  margin-top: clamp(2.5rem, 6vw, 5rem);
}

@media (max-width: 70rem) { .plates { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 48rem) { .plates { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 26rem) { .plates { grid-template-columns: minmax(0, 1fr); } }

.plate { margin: 0; }

.plate img {
  width: 100%;
  height: auto;
  background: var(--field);
}

.plate figcaption {
  margin-top: 0.55rem;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

/* placeholder slots, shown until photos land in photos/ */

.slot {
  background: var(--field);
  display: grid;
  place-items: center;
  color: var(--ink-soft);
  text-align: center;
  padding: 1rem;
}

.hero__frame .slot { width: 100%; height: 100%; }
.plate--slot .slot { aspect-ratio: 3 / 4; }

/* ---------- footer ---------- */

.foot {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
